name: Build Android APK (fork60: iterations 60, repeats 6, side-by-side)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK (fork identity, MAX_TOOL_ITERATIONS=60, MAX_REPEATED_TOOL_CALLS=6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Patch tool-loop limits (asserted)
        run: |
          FILE=composeApp/src/commonMain/kotlin/com/inspiredandroid/kai/data/RemoteDataRepository.kt
          if ! grep -q "MAX_TOOL_ITERATIONS = 15" "$FILE"; then
            echo "::error::anchor 'MAX_TOOL_ITERATIONS = 15' not found - upstream changed; inspect before patching"
            exit 1
          fi
          if ! grep -q "MAX_REPEATED_TOOL_CALLS = 3" "$FILE"; then
            echo "::error::anchor 'MAX_REPEATED_TOOL_CALLS = 3' not found - upstream changed; inspect before patching"
            exit 1
          fi
          sed -i 's/MAX_TOOL_ITERATIONS = 15/MAX_TOOL_ITERATIONS = 60/' "$FILE"
          sed -i 's/MAX_REPEATED_TOOL_CALLS = 3/MAX_REPEATED_TOOL_CALLS = 6/' "$FILE"
          grep -q "MAX_TOOL_ITERATIONS = 60" "$FILE" || { echo "::error::iterations patch did not apply"; exit 1; }
          grep -q "MAX_REPEATED_TOOL_CALLS = 6" "$FILE" || { echo "::error::repeats patch did not apply"; exit 1; }
          echo "OK: both limits patched, asserted in file"
          git --no-pager diff --stat

      - name: Patch app identity for side-by-side install (asserted)
        run: |
          GFILE=androidApp/build.gradle.kts
          if ! grep -q 'applicationId = "com.inspiredandroid.kai"' "$GFILE"; then
            echo "::error::anchor 'applicationId = com.inspiredandroid.kai' not found - upstream changed; inspect before patching"
            exit 1
          fi
          sed -i 's|applicationId = "com.inspiredandroid.kai"|applicationId = "com.inspiredandroid.kai.fork60"|' "$GFILE"
          grep -q 'applicationId = "com.inspiredandroid.kai.fork60"' "$GFILE" || { echo "::error::applicationId patch did not apply"; exit 1; }
          SFILE=androidApp/src/main/res/values/strings.xml
          if grep -q '<string name="app_name">' "$SFILE"; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Kai 9000 Fork</string>|' "$SFILE"
            grep -q 'Kai 9000 Fork' "$SFILE" || { echo "::error::app_name patch did not apply"; exit 1; }
          else
            echo "::warning::app_name strings.xml not found - launcher label stays Kai 9000"
          fi
          echo "OK: identity patched -> com.inspiredandroid.kai.fork60, label = Kai 9000 Fork"

      - name: Build debug APK (auto-signed, no secrets)
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleFossDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kai-apk-fork60-sidebyside
          path: "**/outputs/apk/**/*.apk"
          if-no-files-found: error
